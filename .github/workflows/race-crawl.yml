name: Trigger Race Crawl Job

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 자정 KST (UTC+9)
  workflow_dispatch:

concurrency:
  group: race-crawl
  cancel-in-progress: false

jobs:
  raceCrawlJob:
    runs-on: self-hosted

    steps:
      - name: Checkout IAC
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/iac
          token: ${{ secrets.IAC_REPO_TOKEN }}

      - name: Create and wait for batch Job
        run: |
          RELEASE="race-crawl-$(date +%Y%m%d%H%M%S)"
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          helm install $RELEASE ./helm/runmarket-batch \
            -n applications \
            --wait \
            --timeout 30m

      - name: Delete Job on success
        run: helm uninstall $RELEASE -n applications
