name: Trigger Race Crawl Job

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 자정 KST (UTC+9)
  workflow_dispatch:

concurrency:
  group: race-crawl
  cancel-in-progress: false

jobs:
  raceCrawlJob:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout Pacer
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout IAC
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/iac
          token: ${{ secrets.IAC_REPO_TOKEN }}
          path: iac

      - name: Run batch Job
        run: |
          helm upgrade --install race-crawl ./iac/helm/runmarket-batch \
            -n applications \
            --wait \
            --timeout 30m

      - name: Commit crawl_state.json
        run: |
          cp /data/runmarket/batch/crawl_state.json crawl_state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crawl_state.json
          git diff --staged --quiet || (git commit -m "chore: update crawl_state.json" && git push)
